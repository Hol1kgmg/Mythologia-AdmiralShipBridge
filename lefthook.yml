pre-commit:
  parallel: true
  commands:
    frontend-fix-and-check:
      root: "frontend/"
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: |
        echo "🔧 Frontend: Auto-fix and quality check..."
        task fix:all
        git add {staged_files}
        task check:all
      stage_fixed: true

    backend-fix-and-check:
      root: "backend/"
      glob: "*.py"
      run: |
        echo "🔧 Backend: Auto-fix and quality check..."
        task fix:all
        git add {staged_files}
        task check:all
      stage_fixed: true

    config-files-check:
      glob: "*.{json,yml,yaml,toml,md}"
      exclude: "node_modules/**/*"
      run: |
        echo "📋 Config files changed. Running checks..."
        if echo "{staged_files}" | grep -E "(package\.json|bun\.lockb|tsconfig|biome|\.env)" >/dev/null; then
          echo "🎯 Frontend config detected"
          cd frontend && task check:all
        fi
        if echo "{staged_files}" | grep -E "(pyproject\.toml|uv\.lock|\.env|alembic\.ini)" >/dev/null; then
          echo "🎯 Backend config detected"
          cd backend && task check:all
        fi
        if echo "{staged_files}" | grep -E "(Taskfile\.yml|\.mise\.toml|lefthook\.yml)" >/dev/null; then
          echo "🎯 Project-wide config detected"
          task check:all
        fi

    similarity-check:
      root: "frontend/"
      glob: "*.{js,ts,tsx,jsx}"
      run: similarity-ts . --fail-on-duplicates --print --threshold 0.85 --min-lines 5 --exclude "node_modules" --exclude ".next" --exclude "**/*.test.*" --exclude "**/*.stories.*"
      fail_text: "❌ Code similarity detected! Please refactor duplicate code before committing."

